---
layout: default
tab: blog
---
<article class="post sticker">
  <p class="post__meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    {% if page.tags %}
      {% for tag in page.tags %}<span class="post__tag">#{{ tag }}</span>{% endfor %}
    {% endif %}
  </p>
  <h1 class="post__title">{{ page.title }}</h1>
  <div class="post__body">
    {{ content }}
  </div>
  <p class="post__back"><a href="{{ '/blog.html' | relative_url }}">&larr; blog.md に戻る</a></p>
</article>
